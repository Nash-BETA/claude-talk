[project]
name = "voice-claude"
version = "0.1.0"
description = "マイクで話しかけると Claude Code が音声で答える常駐プログラム（macOS）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mlx-whisper>=0.4.3",
    "numpy>=2.5.4",
    "pykakasi>=2.3.0",
    "sounddevice>=0.5.6",
    "webrtcvad-wheels>=2.0.14.post1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
